name: mirror-os
services:
  dashboard:
    build: .
    init: true
    restart: unless-stopped
    # Raspberry Pi Linux: localhost:8000 is the EXISTING host Hailo service.
    network_mode: host
    env_file: .env
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 256m
    pids_limit: 64
    healthcheck:
      test: [CMD, node, -e, "fetch('http://' + (process.env.HOST === '::1' ? '[::1]' : process.env.HOST === '0.0.0.0' || process.env.HOST === '::' ? '127.0.0.1' : process.env.HOST || '127.0.0.1') + ':' + (process.env.PORT || '3000') + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
