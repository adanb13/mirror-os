name: mirror-os
services:
  dashboard:
    build: .
    init: true
    restart: unless-stopped
    network_mode: host
    # Actual MagicMirror² gets no Hailo or Home Assistant credentials.
    environment:
      HOST: ${HOST:-127.0.0.1}
      PORT: ${PORT:-3000}
      TIMEZONE: ${TIMEZONE:-America/Toronto}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=32m,mode=1777
    pids_limit: 128
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:' + (process.env.PORT || '3000') + '/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'

  # Background API for future integrations. Nothing from it is rendered.
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    init: true
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      HOST: 127.0.0.1
      PORT: ${API_PORT:-3001}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
    pids_limit: 64
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:' + process.env.PORT + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
