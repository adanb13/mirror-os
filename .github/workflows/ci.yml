name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
      - run: sh -n scripts/deploy.sh
      - run: bash -n scripts/update-repos.sh && bash test/update-repos.test.sh
      - run: cp .env.example .env && docker compose config --quiet
      - run: docker compose --progress plain -p mirror-os-ci up -d --build --wait --wait-timeout 120
        env:
          PORT: '3300'
          API_PORT: '3301'
      - run: docker compose -p mirror-os-ci exec -T dashboard node < scripts/smoke-magicmirror.cjs
        env:
          PORT: '3300'
          API_PORT: '3301'
      - run: curl --fail http://127.0.0.1:3301/api/health
      - if: failure()
        run: docker compose -p mirror-os-ci logs --tail=100
      - if: always()
        run: docker compose -p mirror-os-ci down

  images:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: [Dockerfile, Dockerfile.backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
